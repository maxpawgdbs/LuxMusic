name: Android build

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Set commit build version
        shell: bash
        run: |
          BASE_VERSION="$(grep '^luxmusic.baseVersion=' gradle.properties | cut -d= -f2)"
          echo "LUXMUSIC_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "LUXMUSIC_VERSION_NAME=${BASE_VERSION}-edge.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test and build one release APK
        run: ./gradlew --no-daemon offlineUnitTest lintRelease assembleRelease

      - name: Prepare GitHub release assets
        shell: bash
        run: |
          VERSIONED_APK="LuxMusic-${LUXMUSIC_VERSION_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$RUNNER_TEMP/$VERSIONED_APK"
          {
            echo 'RELEASE_FILES<<EOF'
            echo "$RUNNER_TEMP/$VERSIONED_APK"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Update edge tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa edge -m "Edge build" "$GITHUB_SHA"
          git push origin refs/tags/edge --force

      - name: Publish GitHub release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'edge' || github.ref_name }}
          name: LuxMusic Edge
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          preserve_order: true
          generate_release_notes: true
          files: ${{ env.RELEASE_FILES }}
          body: |
            APK assets:
            - `LuxMusic-<version>-arm64-v8a.apk`: signed arm64 release build with bundled update-safe keystore
            - one workflow run and one release APK are produced for each commit pushed to `main`
            - `versionCode` auto-increments, so edge releases install over previous ones
