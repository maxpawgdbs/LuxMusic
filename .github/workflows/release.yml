name: Android release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android regression tests (no Docker)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon -Pluxmusic.emulator=true createDebugAndroidTestCoverageReport

      - name: Create unit-test coverage report
        run: ./gradlew --no-daemon createDebugUnitTestCoverageReport

      - name: Summarize combined source line coverage
        run: python3 scripts/test_coverage_summary.py && python3 scripts/coverage_summary.py

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(grep '^luxmusic.baseVersion=' gradle.properties | cut -d= -f2)"
          VERSION_CODE="$((7002000 + GITHUB_RUN_NUMBER))"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${BASE_VERSION}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="LuxMusic ${BASE_VERSION}"
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            VERSION_NAME="${BASE_VERSION}-edge.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="edge"
            RELEASE_NAME="LuxMusic Edge"
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi
          {
            echo "LUXMUSIC_VERSION_CODE=${VERSION_CODE}"
            echo "LUXMUSIC_VERSION_NAME=${VERSION_NAME}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "RELEASE_NAME=${RELEASE_NAME}"
            echo "PRERELEASE=${PRERELEASE}"
            echo "MAKE_LATEST=${MAKE_LATEST}"
          } >> "$GITHUB_ENV"

      - name: Build and lint universal release APK
        run: ./gradlew --no-daemon lintRelease assembleRelease

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxmusic-0.7.2-coverage
          path: |
            app/build/reports/coverage
          if-no-files-found: warn

      - name: Prepare universal APK
        shell: bash
        run: |
          RELEASE_FILE="$RUNNER_TEMP/LuxMusic-${LUXMUSIC_VERSION_NAME}-universal.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "$RELEASE_FILE"
          echo "RELEASE_FILE=${RELEASE_FILE}" >> "$GITHUB_ENV"

      - name: Update edge tag
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa edge -m "Edge build" "$GITHUB_SHA"
          git push origin refs/tags/edge --force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          # Verify the exact uploaded stable APK before making it public.
          draft: ${{ github.ref_type == 'tag' }}
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.MAKE_LATEST }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          generate_release_notes: true
          files: ${{ env.RELEASE_FILE }}
          body: |
            LuxMusic 0.7.2 — обновлённый интерфейс и более надёжная обработка ошибок.

            На пустом плеере доступны быстрые действия «Добавить музыку» и «Скачать по ссылке». Синхронные ошибки действий, системных экранов, внешних ссылок и фоновых задач показываются в уведомлении внутри приложения; отмена задач не подменяется ошибкой.

            CI запускает JVM- и Android UI/regression tests без Docker и сохраняет отдельные отчёты покрытия обоих типов тестов. Изменений формата библиотеки нет.

            [Изменения 0.7.2](https://github.com/maxpawgdbs/LuxMusic/blob/v0.7.2/docs/release-0.7.2.md)

            Установите APK поверх предыдущей версии — не удаляйте приложение. Подпись, applicationId и расположение загруженной музыки сохранены.

            Универсальный подписанный APK для Android 8.0 и новее.

            Asset: `LuxMusic-${{ env.LUXMUSIC_VERSION_NAME }}-universal.apk`
