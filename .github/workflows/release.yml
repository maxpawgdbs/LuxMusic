name: Android release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(grep '^luxmusic.baseVersion=' gradle.properties | cut -d= -f2)"
          VERSION_CODE="$((6001000 + GITHUB_RUN_NUMBER))"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${BASE_VERSION}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="LuxMusic ${BASE_VERSION}"
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            VERSION_NAME="${BASE_VERSION}-edge.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="edge"
            RELEASE_NAME="LuxMusic Edge"
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi
          {
            echo "LUXMUSIC_VERSION_CODE=${VERSION_CODE}"
            echo "LUXMUSIC_VERSION_NAME=${VERSION_NAME}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "RELEASE_NAME=${RELEASE_NAME}"
            echo "PRERELEASE=${PRERELEASE}"
            echo "MAKE_LATEST=${MAKE_LATEST}"
          } >> "$GITHUB_ENV"

      - name: Test and build universal release APK
        run: ./gradlew --no-daemon offlineUnitTest lintRelease assembleRelease

      - name: Prepare universal APK
        shell: bash
        run: |
          RELEASE_FILE="$RUNNER_TEMP/LuxMusic-${LUXMUSIC_VERSION_NAME}-universal.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "$RELEASE_FILE"
          echo "RELEASE_FILE=${RELEASE_FILE}" >> "$GITHUB_ENV"

      - name: Update edge tag
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa edge -m "Edge build" "$GITHUB_SHA"
          git push origin refs/tags/edge --force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.MAKE_LATEST }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          generate_release_notes: true
          files: ${{ env.RELEASE_FILE }}
          body: |
            Экран загрузки упрощён до двух понятных действий: файл или ссылка. Тип содержимого определяется автоматически.
            Исправлены случайные вылеты и зависания при работе с файлами, ZIP-архивами и загрузками по ссылке.
            Исправлена обработка актуальной метки времени Яндекс Музыки, из-за которой ссылки не скачивались.
            Авторизация аккаунтов перенесена в отдельную вкладку «Настройки» и продолжает работать в фоне во время подтверждения в браузере.
            Прямые HTTPS-ссылки на музыкальные ZIP-архивы теперь распознаются автоматически.
            Добавлены ограничения параллельных тяжёлых операций, безопасная обработка больших файлов и более понятные сообщения об ошибках.
            Расширены модульные и инструментальные тесты импорта, ZIP, навигации, авторизации и загрузок.

            Универсальный подписанный APK для Android 8.0 и новее.

            Asset: `LuxMusic-${{ env.LUXMUSIC_VERSION_NAME }}-universal.apk`
